name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AXONFLOW_TELEMETRY: 'off'
  CARGO_TERM_COLOR: always

# PR rebases cancel orphans by PR#; push-to-main runs each get a unique SHA
# group so they never queue or cancel each other.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-features
    # MSRV matrix deferred — Cargo.lock format v4 requires Cargo 1.78+. Will
    # be re-added once axonflow-sdk-rust#8 establishes an explicit
    # rust-version in Cargo.toml.

  mutation:
    name: Mutation gate (telemetry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A green suite proves the code does what the tests say today; it does not
    # prove the tests would notice if it stopped. This plants seven defects in
    # the heartbeat one at a time and requires the named test to go red.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/mutation-gate.sh

  telemetry-relay:
    name: Telemetry /health relay (runtime-e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Drives the real client against a real listener answering both /health and
    # /v1/ping, and asserts on the bytes that reached the wire. Self-contained
    # (no platform stack), so it runs on every PR rather than only on demand.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./runtime-e2e/3660_health_relay_telemetry/test.sh

  examples:
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --examples
