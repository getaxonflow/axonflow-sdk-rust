name: Integration Tests

# Brings up the AxonFlow community stack via docker compose, runs every example
# end-to-end against it, and asserts each one finishes cleanly. Mirrors the
# axonflow-sdk-go integration.yml pattern — keeps the Rust SDK from regressing
# against the platform's wire contract.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Tuesday 06:00 UTC — failures land in EU/IN working hours, not weekend
    # handover. Aligns with the other SDKs' integration cadence.
    - cron: '0 6 * * 2'

permissions:
  contents: read

# PR rebases cancel orphans by PR#; push-to-main runs each get a unique SHA
# group so they never queue or cancel each other.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AXONFLOW_TELEMETRY: 'off'
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Examples vs community stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip on PRs from forks: the community repo clone uses an anonymous
    # public clone (no token needed), but if anything in the future relies
    # on a token, this guard keeps fork PRs from silently failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout SDK
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Clone Community Stack
        run: |
          git clone --depth 1 https://github.com/getaxonflow/axonflow.git ../axonflow

      - name: Start Community Stack
        run: |
          cd ../axonflow
          docker compose up -d --wait --wait-timeout 180

          echo "Waiting for agent to be healthy…"
          timeout 120 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          echo "Agent is healthy"

          timeout 60 bash -c 'until curl -sf http://localhost:8081/health; do sleep 2; done'
          echo "Orchestrator is healthy"

      - name: Run integration test (basic)
        env:
          AXONFLOW_AGENT_URL: http://localhost:8080
          AXONFLOW_CLIENT_ID: demo-client
          AXONFLOW_CLIENT_SECRET: demo-secret
        run: timeout 60 cargo run --example basic

      - name: Run integration test (connectors)
        env:
          AXONFLOW_AGENT_URL: http://localhost:8080
          AXONFLOW_CLIENT_ID: demo-client
          AXONFLOW_CLIENT_SECRET: demo-secret
        run: timeout 60 cargo run --example connectors

      - name: Run integration test (planning)
        env:
          AXONFLOW_AGENT_URL: http://localhost:8080
          AXONFLOW_CLIENT_ID: demo-client
          AXONFLOW_CLIENT_SECRET: demo-secret
        run: timeout 120 cargo run --example planning

      - name: Run integration test (interceptors)
        env:
          AXONFLOW_AGENT_URL: http://localhost:8080
          AXONFLOW_CLIENT_ID: demo-client
          AXONFLOW_CLIENT_SECRET: demo-secret
        run: timeout 60 cargo run --example interceptors

      - name: Run integration test (anthropic_interceptor)
        env:
          AXONFLOW_AGENT_URL: http://localhost:8080
          AXONFLOW_CLIENT_ID: demo-client
          AXONFLOW_CLIENT_SECRET: demo-secret
        run: timeout 60 cargo run --example anthropic_interceptor

      # The AuthZEN surface (ADR-065, enterprise #3603 / #3611) reaches the
      # community mirror with the v10.3.0 sync. Until then the route does not
      # exist on this stack and the example cannot run.
      #
      # THE GATE ARMS ITSELF. It is a version comparison against the running
      # stack, not a hard-coded skip somebody has to remember to delete: the
      # first mirror build at 10.3.0 or later turns this step from a notice into
      # a required run, and a stack at that version WITHOUT the route fails here
      # rather than reporting a pass. An `if: false` or a commented-out step
      # would have to be noticed by a human to ever run at all.
      - name: Run integration test (authzen)
        env:
          AXONFLOW_AGENT_URL: http://localhost:8080
          AXONFLOW_ENDPOINT: http://localhost:8080
          AXONFLOW_CLIENT_ID: demo-client
          AXONFLOW_CLIENT_SECRET: demo-secret
          AUTHZEN_MIN_STACK_VERSION: '10.3.0'
        run: |
          set -euo pipefail
          # Captured, not piped into a matcher: `curl | grep -q` under
          # `set -o pipefail` reports failure BECAUSE grep matched and closed
          # the pipe early.
          HEALTH=$(curl -sf http://localhost:8080/health)
          VERSION=$(printf '%s' "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "community stack version: $VERSION (AuthZEN needs >= $AUTHZEN_MIN_STACK_VERSION)"
          OLDEST=$(printf '%s\n%s\n' "$VERSION" "$AUTHZEN_MIN_STACK_VERSION" | sort -V | head -1)
          if [ "$VERSION" != "$AUTHZEN_MIN_STACK_VERSION" ] && [ "$OLDEST" = "$VERSION" ]; then
            # A ::notice:: is invisible on the checks list: the step exits 0 and
            # the job shows a plain green tick, so "the AuthZEN example never
            # ran" and "the AuthZEN example passed" look identical to anyone
            # reading CI rather than the log. A ::warning:: annotates the run,
            # and the step summary puts the reason on the job's own page.
            echo "::warning::AuthZEN example SKIPPED: community mirror at $VERSION predates the AuthZEN surface (needs >= $AUTHZEN_MIN_STACK_VERSION). This step becomes mandatory at $AUTHZEN_MIN_STACK_VERSION with no edit."
            {
              echo "### AuthZEN example: SKIPPED"
              echo
              echo "Community mirror is at \`$VERSION\`; the AuthZEN surface needs \`>= $AUTHZEN_MIN_STACK_VERSION\`."
              echo "This step runs itself with no edit once the mirror reaches that version."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### AuthZEN example: RAN against community stack \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          timeout 120 cargo run --example authzen

      # Logs MUST be captured before `Stop Community Stack` runs — `compose
      # down` destroys the containers and `compose logs` then returns nothing.
      # Written INSIDE the workspace: upload-artifact refuses relative `..`
      # paths ("Invalid pattern"), and the old `../axonflow/...` file was
      # only written by the later Stop step anyway, so nothing ever uploaded.
      - name: Show Docker Logs on Failure
        if: failure()
        run: |
          if [ -d "../axonflow" ]; then
            cd ../axonflow
            docker compose logs --tail=200 || true
            docker compose logs --tail=500 > "$GITHUB_WORKSPACE/docker-compose-logs.txt" 2>/dev/null || true
          fi

      - name: Upload Docker Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: docker-compose-logs.txt
          if-no-files-found: ignore

      - name: Stop Community Stack
        if: always()
        run: |
          if [ -d "../axonflow" ]; then
            cd ../axonflow
            docker compose logs --tail=500 > docker-compose-logs.txt 2>/dev/null || true
            docker compose down --volumes --remove-orphans || true
          fi
