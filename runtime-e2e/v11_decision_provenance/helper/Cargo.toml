[package]
name = "v11-decision-provenance-helper"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axonflow-sdk-rust = { path = "../../.." }
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "v11-decision-provenance-helper"
path = "src/main.rs"
