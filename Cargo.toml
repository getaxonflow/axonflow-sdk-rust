[package]
name = "axonflow-sdk-rust"
version = "0.7.0"
edition = "2021"
rust-version = "1.78"
description = "Rust SDK for the AxonFlow AI governance platform"
license = "MIT"
repository = "https://github.com/getaxonflow/axonflow-sdk-rust"
homepage = "https://getaxonflow.com"
documentation = "https://docs.rs/axonflow-sdk-rust"
readme = "README.md"
keywords = ["ai", "governance", "llm", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
moka = { version = "0.12", features = ["future"] }
tracing = "0.1"
# TODO: migrate to `time` or `jiff` in the next major version.
# chrono has known soundness issues and upstream recommends
# alternatives for new projects (see RUSTSEC advisories).
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
home = "0.5"
percent-encoding = "2.3"
base64 = "0.22"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.10"

[[example]]
name = "basic"
path = "examples/basic/main.rs"

[[example]]
name = "connectors"
path = "examples/connectors/main.rs"

[[example]]
name = "planning"
path = "examples/planning/main.rs"

[[example]]
name = "interceptors"
path = "examples/interceptors/main.rs"

[[example]]
name = "anthropic_interceptor"
path = "examples/anthropic_interceptor/main.rs"

[[example]]
name = "explain_decision"
path = "examples/explain_decision/main.rs"

[[example]]
name = "list_decisions"
path = "examples/list_decisions/main.rs"
