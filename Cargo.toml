[package]
name = "axonflow-sdk-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Rust SDK for the AxonFlow AI governance platform"
license = "MIT"
repository = "https://github.com/getaxonflow/axonflow-sdk-rust"
homepage = "https://getaxonflow.com"
documentation = "https://docs.rs/axonflow-sdk-rust"
readme = "README.md"
keywords = ["ai", "governance", "llm", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
moka = { version = "0.12", features = ["future"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
home = "0.5"
percent-encoding = "2.3"
base64 = "0.22"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3.10"

[[example]]
name = "basic"
path = "examples/basic/main.rs"

[[example]]
name = "connectors"
path = "examples/connectors/main.rs"

[[example]]
name = "planning"
path = "examples/planning/main.rs"

[[example]]
name = "interceptors"
path = "examples/interceptors/main.rs"
